name: Apply room booking edit state fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/room-booking-edit-state-20260611-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply edit state fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --ignore-whitespace --whitespace=nowarn .github/room-booking-edit-state-20260611.patch
          node --check api/claude.js
          node --check api/room-booking.js
          node --check api/room-booking-availability.js
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          for(const script of scripts)new Function(script);
          for(const text of ['var editingRoomBookingId=null','handleRoomBookingScreenshot','loadRoomBookingIntoForm','Save for approval']){
            if(!html.includes(text))throw new Error('Missing '+text);
          }
          if(html.includes('let editingRoomBookingId'))throw new Error('TDZ-prone let remains');
          NODE
          rm -f .github/room-booking-edit-state-20260611.patch .github/room-booking-edit-state-20260611-trigger.txt .github/workflows/apply-room-booking-edit-state-20260611.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Fix room booking edit state initialization'
          git push origin HEAD:main
