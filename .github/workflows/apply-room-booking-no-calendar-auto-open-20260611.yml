name: Apply room booking no calendar auto-open fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/room-booking-no-calendar-auto-open-20260611-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fallback behavior fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --ignore-whitespace --whitespace=nowarn .github/room-booking-no-calendar-auto-open-20260611.patch
          node --check api/claude.js
          node --check api/room-booking.js
          node --check api/room-booking-availability.js
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          for(const script of scripts)new Function(script);
          if(html.includes('Opened a Google Calendar draft instead'))throw new Error('old auto-open fallback remains');
          if(!html.includes('Use Calendar draft if you need to add this event manually'))throw new Error('missing new fallback message');
          NODE
          rm -f .github/room-booking-no-calendar-auto-open-20260611.patch .github/room-booking-no-calendar-auto-open-20260611-trigger.txt .github/workflows/apply-room-booking-no-calendar-auto-open-20260611.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Stop auto-opening calendar draft on booking sync fallback'
          git push origin HEAD:main
