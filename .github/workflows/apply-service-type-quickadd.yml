name: Apply service type quick-add

on:
  push:
    branches:
      - main
    paths:
      - .codex/service-type-quickadd.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Patch service type quick-add
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');

          function replaceOne(from, to, label) {
            if (!html.includes(from)) throw new Error('Patch target not found: ' + label);
            html = html.replace(from, to);
          }

          replaceOne(
`          <select id="lc-service" onchange="autoFillVendor()">
            <option value="">— Select service type —</option>
            <option value="plumbing">Plumbing</option><option value="hvac">HVAC</option>
            <option value="electrical">Electrical</option><option value="locksmith">Locksmith</option>
            <option value="fire">Fire Sprinkler System</option><option value="extinguisher">Fire Extinguishers</option>
            <option value="hood">Kitchen Hood Fire System</option><option value="general">General / Handyman</option>
            <option value="other">Other</option>
          </select>`,
`          <select id="lc-service" onchange="handleServiceSelect()">
            <option value="">— Select service type —</option>
            <option value="plumbing">Plumbing</option><option value="hvac">HVAC</option>
            <option value="electrical">Electrical</option><option value="locksmith">Locksmith</option>
            <option value="fire">Fire Sprinkler System</option><option value="extinguisher">Fire Extinguishers</option>
            <option value="hood">Kitchen Hood Fire System</option><option value="general">General / Handyman</option>
            <option value="window cleaning">Window Cleaning</option><option value="other">Other</option>
            <option value="__custom__">+ Add new service type...</option>
          </select>
          <input id="lc-service-custom" placeholder="Type new service type" style="display:none;margin-top:6px"/>`,
            'log call service dropdown'
          );

          replaceOne(
`function matchVendor(cat){
  cat=(cat||'').toLowerCase();
  const map={plumbing:'Plumbing',hvac:'HVAC',electrical:'Electrical',locksmith:'Locksmith',lock:'Locksmith',fire:'Fire Sprinkler System',sprinkler:'Fire Sprinkler System',extinguisher:'Fire Extinguishers',hood:'Kitchen Hood Fire System'};
  for(const[k,v]of Object.entries(map))if(cat.includes(k))return VENDORS.find(vn=>vn.trade===v)||VENDORS[0];
  return VENDORS.find(v=>v.trade==='Plumbing')||VENDORS[0];
}
`,
`function cleanFieldValue(v){return (v||'').toString().trim();}
function lowerFieldValue(v){return cleanFieldValue(v).toLowerCase();}
function defaultVendor(trade){return {name:'TBD',trade:trade||'Unassigned',contact:'',email:'',phone:''};}
function matchVendor(cat){
  const original=cleanFieldValue(cat);
  const lower=lowerFieldValue(original);
  if(!lower)return null;
  const map={plumbing:'Plumbing',hvac:'HVAC',electrical:'Electrical',locksmith:'Locksmith',lock:'Locksmith',fire:'Fire Sprinkler System',sprinkler:'Fire Sprinkler System',extinguisher:'Fire Extinguishers',hood:'Kitchen Hood Fire System',window:'Window Cleaning',cleaning:'Window Cleaning'};
  for(const[k,trade]of Object.entries(map)){
    if(lower.includes(k))return VENDORS.find(vn=>lowerFieldValue(vn.trade)===lowerFieldValue(trade))||defaultVendor(trade);
  }
  return VENDORS.find(v=>lowerFieldValue(v.trade)===lower)||defaultVendor(original||'Unassigned');
}
function getServiceValue(){
  const selected=document.getElementById('lc-service').value;
  if(selected==='__custom__')return cleanFieldValue(document.getElementById('lc-service-custom').value);
  return cleanFieldValue(selected);
}
function handleServiceSelect(){
  const custom=document.getElementById('lc-service-custom');
  const isCustom=document.getElementById('lc-service').value==='__custom__';
  custom.style.display=isCustom?'block':'none';
  if(isCustom)custom.focus();
  autoFillVendor();
}
`,
            'service helpers and vendor matching'
          );

          replaceOne(
`function autoFillVendor(){const v=matchVendor(document.getElementById('lc-service').value);if(v){document.getElementById('lc-vendor').value=v.name;document.getElementById('lc-vendor-contact').value=v.contact;document.getElementById('lc-vendor-phone').value=formatPhone(v.phone);document.getElementById('lc-vendor-email').value=v.email;}}
`,
`function autoFillVendor(){const v=matchVendor(getServiceValue());if(v){document.getElementById('lc-vendor').value=v.name==='TBD'?'':v.name;document.getElementById('lc-vendor-contact').value=v.contact||'';document.getElementById('lc-vendor-phone').value=formatPhone(v.phone||'');document.getElementById('lc-vendor-email').value=v.email||'';}}
`,
            'autoFillVendor service value'
          );

          replaceOne(
`  const service=document.getElementById('lc-service').value;
`,
`  const service=getServiceValue();
`,
            'submit service value'
          );

          replaceOne(
`  const costMap={plumbing:'$150-$400',hvac:'$200-$500',electrical:'$150-$350',locksmith:'$100-$250',fire:'$200-$600',extinguisher:'$100-$300',hood:'$300-$800',general:'$100-$300',other:'$100-$300'};
`,
`  const costMap={plumbing:'$150-$400',hvac:'$200-$500',electrical:'$150-$350',locksmith:'$100-$250',fire:'$200-$600',extinguisher:'$100-$300',hood:'$300-$800',general:'$100-$300','window cleaning':'$150-$350',other:'$100-$300'};
`,
            'cost map window cleaning'
          );

          replaceOne(
`estimatedCost:costMap[service]||'$100-$300'`,
`estimatedCost:costMap[lowerFieldValue(service)]||'$100-$300'`,
            'estimated cost lookup'
          );

          replaceOne(
`  document.getElementById('lc-title').value='';document.getElementById('lc-description').value='';document.getElementById('lc-notes').value='';document.getElementById('lc-owner-approval').checked=false;document.getElementById('owner-approval-fields').style.display='none';document.getElementById('lc-owner-name').value='';document.getElementById('lc-owner-email').value='';document.getElementById('photo-previews').innerHTML='';uploadedPhotos=[];
`,
`  document.getElementById('lc-title').value='';document.getElementById('lc-description').value='';document.getElementById('lc-notes').value='';if(document.getElementById('lc-service-custom')){document.getElementById('lc-service-custom').value='';document.getElementById('lc-service-custom').style.display='none';}document.getElementById('lc-owner-approval').checked=false;document.getElementById('owner-approval-fields').style.display='none';document.getElementById('lc-owner-name').value='';document.getElementById('lc-owner-email').value='';document.getElementById('photo-previews').innerHTML='';uploadedPhotos=[];
`,
            'reset service custom field'
          );

          fs.writeFileSync(file, html);
          NODE

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add service type quick-add"
          git push
