name: Tenant access contact fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/tenant-access-fix-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply tenant access contact fix
        shell: bash
        run: |
          set -euo pipefail
          if grep -q tenantAccessEmailText index.html; then
            echo Already applied.
          else
            printf '%s' '' | base64 -d > /tmp/tenant-access.patch
            git apply --whitespace=nowarn /tmp/tenant-access.patch
          fi
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const parts=html.split('<script>');
          for(const part of parts.slice(1)){
            const script=part.split('</script>')[0];
            new Function(script);
          }
          if(!html.includes('tenantAccessEmailText')) throw new Error('tenant access email helper missing');
          if(!html.includes('Tenant phone: ')) throw new Error('tenant phone output missing');
          NODE
          rm -f .github/workflows/apply-tenant-access-fix.yml .github/tenant-access-fix-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/apply-tenant-access-fix.yml .github/tenant-access-fix-trigger.txt
          if git diff --cached --quiet; then
            echo No changes to commit.
          else
            git commit -m 'Include tenant access contact in work orders'
            git push origin HEAD:main
          fi
