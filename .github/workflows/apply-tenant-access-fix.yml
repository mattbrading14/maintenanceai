name: Apply tenant access contact fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch index.html
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');

          if (!html.includes('function tenantAccessEmailText')) {
            const replacements = [
              [
                "tenant_email:matchedTenant?matchedTenant.email:'',date:new Date().toLocaleDateString",
                "tenant_email:matchedTenant?matchedTenant.email:'',tenant_phone:matchedTenant?tenantPhone(matchedTenant):'',date:new Date().toLocaleDateString"
              ],
              [
                "tenant_email:tenant.email,date:new Date(datetime).toLocaleDateString",
                "tenant_email:tenant.email,tenant_phone:tenantPhone(tenant),date:new Date(datetime).toLocaleDateString"
              ],
              [
                "function assignTenant(id,unit){if(!unit)return;const wo=workOrders.find(w=>w.id===id),t=TENANTS.find(t=>t.unit===unit);if(!wo||!t)return;wo.tenant=t.contact;wo.unit=t.unit;wo.business=t.business;wo.tenant_email=t.email;saveData();renderQueue();}",
                "function assignTenant(id,unit){if(!unit)return;const wo=workOrders.find(w=>w.id===id),t=TENANTS.find(t=>t.unit===unit);if(!wo||!t)return;wo.tenant=t.contact;wo.unit=t.unit;wo.business=t.business;wo.tenant_email=t.email;wo.tenant_phone=tenantPhone(t);saveData();renderQueue();}"
              ],
              [
                "if(tn){wo.tenant=tn.contact;wo.unit=tn.unit;wo.business=tn.business;wo.tenant_email=tn.email;}",
                "if(tn){wo.tenant=tn.contact;wo.unit=tn.unit;wo.business=tn.business;wo.tenant_email=tn.email;wo.tenant_phone=tenantPhone(tn);}"
              ],
              [
                "function downloadWOPDF(woId){\n  const wo=workOrders.find(w=>w.id===woId);if(!wo)return;\n  const win=window.open('',",
                "function downloadWOPDF(woId){\n  const wo=workOrders.find(w=>w.id===woId);if(!wo)return;\n  syncTenantAccessContact(wo);\n  const win=window.open('',"
              ],
              [
                "<tr><td>Est. time</td><td>'+wo.estimated_time+'</td></tr><tr><td>Access required</td><td>'+(wo.access_needed?'Yes — coordinate with tenant':'No')+'</td></tr>'+(wo.notes_for_vendor?",
                "<tr><td>Est. time</td><td>'+wo.estimated_time+'</td></tr>'+tenantAccessPdfRows(wo)+(wo.notes_for_vendor?"
              ]
            ];

            for (const [from, to] of replacements) {
              if (!html.includes(from)) throw new Error('Expected source fragment not found: ' + from.slice(0, 90));
              html = html.replace(from, to);
            }

            const emailFrom = `function emailWO(id,ctx){
  const wo=workOrders.find(w=>w.id===id);if(!wo)return;
  wo.status='emailed';updateQueueCount();saveData();
  const subject=encodeURIComponent('Work Order '+wo.id+' — '+wo.issue_summary+' — 146 Main St, Los Altos');
  const body=encodeURIComponent('Dear '+wo.vendor.contact+',\n\nNew work order at 146 Main St, Los Altos.\n\nWork Order: '+wo.id+'\nDate: '+wo.date+'\nTenant: '+wo.tenant+' — Unit '+wo.unit+(wo.business?' ('+wo.business+')':'')+'\nIssue: '+wo.issue_summary+'\nPriority: '+wo.priority+'\n\nAction: '+wo.recommended_action+'\nAccess Required: '+(wo.access_needed?'Yes — coordinate with tenant':'No')+(wo.notes_for_vendor?'\nNotes: '+wo.notes_for_vendor:'')+'\n\nPlease confirm receipt.\n\nThank you,\nMatt Brading\nBrading Associates, LLC\n(408) 234-7016');
  window.open('mailto:'+wo.vendor.email+'?subject='+subject+'&body='+body);
  const el=document.getElementById((ctx==='queue'?'qaction-':'action-')+id);
  if(el)el.innerHTML='<span style="color:#6d28d9">Email opened to '+wo.vendor.contact+'</span>';
  if(ctx==='queue')renderQueue();
}`;
            const emailTo = `function emailWO(id,ctx){
  const wo=workOrders.find(w=>w.id===id);if(!wo)return;
  syncTenantAccessContact(wo);wo.status='emailed';updateQueueCount();saveData();
  const subject=encodeURIComponent('Work Order '+wo.id+' — '+wo.issue_summary+' — 146 Main St, Los Altos');
  const body=encodeURIComponent('Dear '+wo.vendor.contact+',\n\nNew work order at 146 Main St, Los Altos.\n\nWork Order: '+wo.id+'\nDate: '+wo.date+'\nTenant: '+wo.tenant+' — Unit '+wo.unit+(wo.business?' ('+wo.business+')':'')+'\nIssue: '+wo.issue_summary+'\nPriority: '+wo.priority+'\n\nAction: '+wo.recommended_action+'\n'+tenantAccessEmailText(wo)+(wo.notes_for_vendor?'\nNotes: '+wo.notes_for_vendor:'')+'\n\nPlease confirm receipt.\n\nThank you,\nMatt Brading\nBrading Associates, LLC\n(408) 234-7016');
  window.open('mailto:'+wo.vendor.email+'?subject='+subject+'&body='+body);
  const el=document.getElementById((ctx==='queue'?'qaction-':'action-')+id);
  if(el)el.innerHTML='<span style="color:#6d28d9">Email opened to '+wo.vendor.contact+'</span>';
  if(ctx==='queue')renderQueue();
}`;
            if (!html.includes(emailFrom)) throw new Error('Expected emailWO block not found');
            html = html.replace(emailFrom, emailTo);

            const helpers = `function cleanText(v){return (v==null?'':String(v)).trim();}
function escapeHtml(v){return cleanText(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function tenantPhone(t){return t?cleanText(t.cell_phone)||cleanText(t.office_phone):'';}
function tenantForWO(wo){
  const unit=cleanText(wo&&wo.unit).replace(/^unit\\s+/i,'');
  return TENANTS.find(t=>cleanText(t.unit).toLowerCase()===unit.toLowerCase())||
    TENANTS.find(t=>cleanText(t.email)&&cleanText(t.email).toLowerCase()===cleanText(wo&&wo.tenant_email).toLowerCase())||
    TENANTS.find(t=>cleanText(t.contact).toLowerCase()===cleanText(wo&&wo.tenant).toLowerCase())||
    null;
}
function syncTenantAccessContact(wo){
  if(!wo)return wo;
  const t=tenantForWO(wo);
  if(t){
    wo.tenant=cleanText(wo.tenant)||t.contact;
    wo.unit=cleanText(wo.unit)==='Unknown'?t.unit:(cleanText(wo.unit)||t.unit);
    wo.business=cleanText(wo.business)||t.business;
    wo.tenant_email=cleanText(wo.tenant_email)||t.email;
    wo.tenant_phone=cleanText(wo.tenant_phone)||tenantPhone(t);
  }
  return wo;
}
function tenantAccessDetails(wo){
  syncTenantAccessContact(wo);
  const t=tenantForWO(wo);
  return {
    name:cleanText(wo&&wo.tenant)||cleanText(t&&t.contact),
    unit:cleanText(wo&&wo.unit)||cleanText(t&&t.unit),
    business:cleanText(wo&&wo.business)||cleanText(t&&t.business),
    phone:cleanText(wo&&wo.tenant_phone)||tenantPhone(t),
    email:cleanText(wo&&wo.tenant_email)||cleanText(t&&t.email)
  };
}
function tenantAccessLabel(c){
  return [c.name,c.unit?'Unit '+c.unit:'',c.business].filter(Boolean).join(' - ');
}
function tenantAccessEmailText(wo){
  if(!wo.access_needed)return 'Access Required: No';
  const c=tenantAccessDetails(wo);
  const lines=['Access Required: Yes - coordinate with tenant'];
  const label=tenantAccessLabel(c);
  if(label)lines.push('Tenant access contact: '+label);
  if(c.phone)lines.push('Tenant phone: '+formatPhone(c.phone));
  if(c.email)lines.push('Tenant email: '+c.email);
  return lines.join('\\n');
}
function tenantAccessPdfRows(wo){
  if(!wo.access_needed)return '<tr><td>Access required</td><td>No</td></tr>';
  const c=tenantAccessDetails(wo);
  let rows='<tr><td>Access required</td><td>Yes - coordinate with tenant</td></tr>';
  const label=tenantAccessLabel(c);
  if(label)rows+='<tr><td>Tenant access contact</td><td>'+escapeHtml(label)+'</td></tr>';
  if(c.phone)rows+='<tr><td>Tenant phone</td><td>'+escapeHtml(formatPhone(c.phone))+'</td></tr>';
  if(c.email)rows+='<tr><td>Tenant email</td><td>'+escapeHtml(c.email)+'</td></tr>';
  return rows;
}
`;
            const marker = "function formatPhone(p){const d=(p||'').replace(/\\D/g,'');return d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):p;}";
            if (!html.includes(marker)) throw new Error('formatPhone marker not found');
            html = html.replace(marker, helpers + marker);
            fs.writeFileSync(path, html);
          }
          NODE

      - name: Commit source fix and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-tenant-access-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-tenant-access-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Include tenant access contact in work orders"
          git push
