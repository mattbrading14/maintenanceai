name: Apply editable fields patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-editable-fields-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Patch 146 Main St app fields
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');

          function replaceOne(from, to, label) {
            if (!html.includes(from)) throw new Error('Patch target not found: ' + label);
            html = html.replace(from, to);
          }

          replaceOne(
`          <select id="lc-service" onchange="autoFillVendor()">
            <option value="">— Select service type —</option>
            <option value="plumbing">Plumbing</option><option value="hvac">HVAC</option>
            <option value="electrical">Electrical</option><option value="locksmith">Locksmith</option>
            <option value="fire">Fire Sprinkler System</option><option value="extinguisher">Fire Extinguishers</option>
            <option value="hood">Kitchen Hood Fire System</option><option value="general">General / Handyman</option>
            <option value="other">Other</option>
          </select>`,
`          <select id="lc-service" onchange="handleServiceSelect()">
            <option value="">— Select service type —</option>
            <option value="plumbing">Plumbing</option><option value="hvac">HVAC</option>
            <option value="electrical">Electrical</option><option value="locksmith">Locksmith</option>
            <option value="fire">Fire Sprinkler System</option><option value="extinguisher">Fire Extinguishers</option>
            <option value="hood">Kitchen Hood Fire System</option><option value="general">General / Handyman</option>
            <option value="window cleaning">Window Cleaning</option>
            <option value="other">Other / Custom...</option>
          </select>
          <input id="lc-service-custom" placeholder="Type a new category..." style="display:none;margin-top:6px"/>`,
            'log call service dropdown'
          );

          replaceOne(
`            <select id="bid-trade">
              <option value="">— Select trade —</option>
              <option>Painting</option><option>Plumbing</option><option>HVAC</option><option>Electrical</option>
              <option>Roofing</option><option>Flooring</option><option>General / Handyman</option>
              <option>Landscaping</option><option>Pest Control</option><option>Concrete / Masonry</option>
              <option>Windows / Doors</option><option>Other</option>
            </select>`,
`            <select id="bid-trade" onchange="handleBidTradeSelect()">
              <option value="">— Select trade —</option>
              <option>Painting</option><option>Plumbing</option><option>HVAC</option><option>Electrical</option>
              <option>Roofing</option><option>Flooring</option><option>General / Handyman</option>
              <option>Landscaping</option><option>Pest Control</option><option>Concrete / Masonry</option>
              <option>Windows / Doors</option><option>Window Cleaning</option><option>Other</option>
              <option value="__custom__">+ Add custom trade...</option>
            </select>
            <input id="bid-trade-custom" placeholder="Type a new trade / category..." style="display:none;margin-top:6px"/>`,
            'bid trade dropdown'
          );

          replaceOne(
`              <option>Roofing</option><option>General / Handyman</option><option>Pest Control</option>
              <option>Landscaping</option><option>Elevator</option><option>Appliance Repair</option>
              <option value="__custom__">+ Add custom trade...</option>`,
`              <option>Roofing</option><option>General / Handyman</option><option>Pest Control</option>
              <option>Landscaping</option><option>Elevator</option><option>Appliance Repair</option>
              <option>Painting</option><option>Window Cleaning</option>
              <option value="__custom__">+ Add custom trade...</option>`,
            'vendor trade options'
          );

          replaceOne(
`          {type:'text',text:'You are a property management AI for 146 Main St, Los Altos. Read this image and extract ALL maintenance issues.\n\nTenant list:\n'+tenantList+'\n\nMatch sender to tenant list. If no match use "Unknown".\n\nReturn ONLY valid JSON:\n{"matched_tenant_unit":"unit or Unknown","matched_tenant_name":"name or Unknown","sender_info":"what you saw","issues":[{"title":"short title","description":"full details","category":"plumbing|hvac|electrical|locksmith|fire|general","priority":"urgent|normal|low","recommended_action":"what vendor should do","estimated_cost":"e.g. $150-$300"}]}'}
`,
`          {type:'text',text:'You are a property management AI for 146 Main St, Los Altos. Read this image and extract ALL maintenance issues.\n\nTenant list:\n'+tenantList+'\n\nMatch sender to tenant list. If no match use "Unknown".\n\nReturn ONLY valid JSON:\n{"matched_tenant_unit":"unit or Unknown","matched_tenant_name":"name or Unknown","sender_info":"what you saw","issues":[{"title":"short title","description":"full details","category":"plumbing|hvac|electrical|locksmith|fire|window cleaning|general","priority":"urgent|normal|low","recommended_action":"what vendor should do","estimated_cost":"e.g. $150-$300"}]}'}
`,
            'AI category prompt'
          );

          replaceOne(
`function matchVendor(cat){
  cat=(cat||'').toLowerCase();
  const map={plumbing:'Plumbing',hvac:'HVAC',electrical:'Electrical',locksmith:'Locksmith',lock:'Locksmith',fire:'Fire Sprinkler System',sprinkler:'Fire Sprinkler System',extinguisher:'Fire Extinguishers',hood:'Kitchen Hood Fire System'};
  for(const[k,v]of Object.entries(map))if(cat.includes(k))return VENDORS.find(vn=>vn.trade===v)||VENDORS[0];
  return VENDORS.find(v=>v.trade==='Plumbing')||VENDORS[0];
}
`,
`function cleanFieldValue(v){return (v||'').toString().trim();}
function lowerFieldValue(v){return cleanFieldValue(v).toLowerCase();}
function fieldAttr(v){return cleanFieldValue(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function blankVendor(trade){return {name:'TBD',trade:trade||'Unassigned',contact:'',email:'',phone:''};}
function matchVendor(cat){
  const original=cleanFieldValue(cat);
  const lower=lowerFieldValue(original);
  const map={plumbing:'Plumbing',hvac:'HVAC',electrical:'Electrical',locksmith:'Locksmith',lock:'Locksmith',fire:'Fire Sprinkler System',sprinkler:'Fire Sprinkler System',extinguisher:'Fire Extinguishers',hood:'Kitchen Hood Fire System',window:'Window Cleaning',cleaning:'Window Cleaning',paint:'Painting'};
  for(const[k,trade] of Object.entries(map)){
    if(lower.includes(k)){
      const matched=VENDORS.find(v=>lowerFieldValue(v.trade)===lowerFieldValue(trade));
      if(matched)return matched;
      return blankVendor(trade);
    }
  }
  const direct=VENDORS.find(v=>lowerFieldValue(v.trade)===lower||lowerFieldValue(v.name)===lower);
  if(direct)return direct;
  return blankVendor(original||'Unassigned');
}
function getServiceValue(){
  const selected=document.getElementById('lc-service').value;
  if(selected==='other')return cleanFieldValue(document.getElementById('lc-service-custom').value);
  return cleanFieldValue(selected);
}
function handleServiceSelect(){
  const custom=document.getElementById('lc-service-custom');
  custom.style.display=document.getElementById('lc-service').value==='other'?'block':'none';
  if(custom.style.display==='block')custom.focus();
  autoFillVendor();
}
function handleBidTradeSelect(){
  const custom=document.getElementById('bid-trade-custom');
  if(!custom)return;
  custom.style.display=document.getElementById('bid-trade').value==='__custom__'?'block':'none';
  if(custom.style.display==='block')custom.focus();
}
function getBidTradeValue(){
  const selected=document.getElementById('bid-trade').value;
  return cleanFieldValue(selected==='__custom__'?document.getElementById('bid-trade-custom').value:selected);
}
`,
            'field helper functions'
          );

          replaceOne(
`function autoFillVendor(){const v=matchVendor(document.getElementById('lc-service').value);if(v){document.getElementById('lc-vendor').value=v.name;document.getElementById('lc-vendor-contact').value=v.contact;document.getElementById('lc-vendor-phone').value=formatPhone(v.phone);document.getElementById('lc-vendor-email').value=v.email;}}
`,
`function autoFillVendor(){const service=getServiceValue();const v=matchVendor(service);if(v){document.getElementById('lc-vendor').value=v.name==='TBD'?'':v.name;document.getElementById('lc-vendor-contact').value=v.contact||'';document.getElementById('lc-vendor-phone').value=formatPhone(v.phone||'');document.getElementById('lc-vendor-email').value=v.email||'';}}
`,
            'autoFillVendor'
          );

          replaceOne(
`  const service=document.getElementById('lc-service').value;
`,
`  const service=getServiceValue();
`,
            'submit service value'
          );

          replaceOne(
`  const costMap={plumbing:'$150-$400',hvac:'$200-$500',electrical:'$150-$350',locksmith:'$100-$250',fire:'$200-$600',extinguisher:'$100-$300',hood:'$300-$800',general:'$100-$300',other:'$100-$300'};
`,
`  const costMap={plumbing:'$150-$400',hvac:'$200-$500',electrical:'$150-$350',locksmith:'$100-$250',fire:'$200-$600',extinguisher:'$100-$300',hood:'$300-$800',general:'$100-$300','window cleaning':'$150-$350',painting:'$300-$900',other:'$100-$300'};
`,
            'cost map'
          );

          replaceOne(
`estimatedCost:costMap[service]||'$100-$300'`,
`estimatedCost:costMap[lowerFieldValue(service)]||'$100-$300'`,
            'estimated cost lookup'
          );

          replaceOne(
`        '<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Description</div><textarea id="ed-'+sid+'" rows="2" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a;resize:none">'+(wo.description||wo.recommended_action||'')+'</textarea></div>'+
        '<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Tenant</div><select id="eten-'+sid+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"><option value="">— Select tenant —</option>'+tOpts+'</select></div>'+`,
`        '<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Description</div><textarea id="ed-'+sid+'" rows="2" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a;resize:none">'+(wo.description||wo.recommended_action||'')+'</textarea></div>'+
        '<div class="row2" style="margin-bottom:8px"><div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Category</div><input id="ec-'+sid+'" value="'+fieldAttr(wo.category)+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"/></div><div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Date</div><input id="edate-'+sid+'" value="'+fieldAttr(wo.date)+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"/></div></div>'+
        '<div class="row2" style="margin-bottom:8px"><div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Recommended action</div><input id="eact-'+sid+'" value="'+fieldAttr(wo.recommended_action)+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"/></div><div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Estimated time</div><input id="etime-'+sid+'" value="'+fieldAttr(wo.estimated_time)+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"/></div></div>'+
        '<div class="row2" style="margin-bottom:8px"><div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Access needed</div><select id="eaccess-'+sid+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"><option value="yes"'+(wo.access_needed?' selected':'')+'>Yes</option><option value="no"'+(!wo.access_needed?' selected':'')+'>No</option></select></div><div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Status</div><select id="estatus-'+sid+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"><option value="pending"'+(wo.status==='pending'?' selected':'')+'>Pending approval</option><option value="owner_pending"'+(wo.status==='owner_pending'?' selected':'')+'>Awaiting owner approval</option><option value="emailed"'+(wo.status==='emailed'?' selected':'')+'>Emailed to vendor</option><option value="approved"'+(wo.status==='approved'?' selected':'')+'>Approved</option><option value="completed"'+(wo.status==='completed'?' selected':'')+'>Completed</option><option value="denied"'+(wo.status==='denied'?' selected':'')+'>Denied</option></select></div></div>'+
        '<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px">Tenant</div><select id="eten-'+sid+'" style="width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a"><option value="">— Select tenant —</option>'+tOpts+'</select></div>'+`,
            'work order edit fields'
          );

          replaceOne(
`  wo.issue_summary=t;wo.description=document.getElementById('ed-'+s).value.trim();wo.priority=document.getElementById('ep-'+s).value;wo.recommended_action=wo.description||t;
`,
`  wo.issue_summary=t;
  wo.description=document.getElementById('ed-'+s).value.trim();
  wo.category=document.getElementById('ec-'+s).value.trim()||wo.category;
  wo.date=document.getElementById('edate-'+s).value.trim()||wo.date;
  wo.recommended_action=document.getElementById('eact-'+s).value.trim()||wo.description||t;
  wo.estimated_time=document.getElementById('etime-'+s).value.trim()||wo.estimated_time;
  wo.access_needed=document.getElementById('eaccess-'+s).value==='yes';
  wo.status=document.getElementById('estatus-'+s).value;
  wo.priority=document.getElementById('ep-'+s).value;
`,
            'save work order edit fields'
          );

          replaceOne(
`  const trade=document.getElementById('bid-trade').value;
`,
`  const trade=getBidTradeValue();
`,
            'bid trade value'
          );

          replaceOne(
`    document.getElementById('bid-trade').value='';
`,
`    document.getElementById('bid-trade').value='';
    const btc=document.getElementById('bid-trade-custom'); if(btc){btc.value='';btc.style.display='none';}
`,
            'reset bid custom trade'
          );

          replaceOne(
`  document.getElementById('lc-title').value='';document.getElementById('lc-description').value='';document.getElementById('lc-notes').value='';document.getElementById('lc-owner-approval').checked=false;document.getElementById('owner-approval-fields').style.display='none';document.getElementById('lc-owner-name').value='';document.getElementById('lc-owner-email').value='';document.getElementById('photo-previews').innerHTML='';uploadedPhotos=[];
`,
`  document.getElementById('lc-title').value='';document.getElementById('lc-description').value='';document.getElementById('lc-notes').value='';document.getElementById('lc-service-custom').value='';document.getElementById('lc-service-custom').style.display='none';document.getElementById('lc-owner-approval').checked=false;document.getElementById('owner-approval-fields').style.display='none';document.getElementById('lc-owner-name').value='';document.getElementById('lc-owner-email').value='';document.getElementById('photo-previews').innerHTML='';uploadedPhotos=[];
`,
            'reset log call custom category'
          );

          fs.writeFileSync(file, html);
          NODE

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "codex-app"
          git config user.email "codex-app@users.noreply.github.com"
          git add index.html
          git commit -m "Make 146 Main St fields editable"
          git push
