<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MaintenanceAI LinkedIn banner</title>
  <desc id="desc">A LinkedIn profile banner for MaintenanceAI highlighting the newest property management workflows.</desc>
  <defs>
